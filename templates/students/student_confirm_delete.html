<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Student - Grace Academy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark px-4 py-3 mb-4">
        <a class="navbar-brand fw-bold" href="{% url 'student_list' %}">
            <i class="fa-solid fa-graduation-cap me-2"></i>Grace Academy
        </a>
        <a href="{% url 'student_list' %}" class="btn btn-outline-light btn-sm">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Student List
        </a>
    </nav>

    <div class="container col-lg-6 my-5">
        <div class="card border-0 shadow-sm p-4 text-center">
            <div class="text-danger mb-3">
                <i class="fa-solid fa-triangle-exclamation fa-4x"></i>
            </div>
            <h4 class="fw-bold mb-2">Delete Student Record?</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong>{{ student.first_name }} {{ student.last_name }}</strong> (Admission No: <code>{{ student.admission_number }}</code>)? This action cannot be undone.
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-2">
                    <a href="{% url 'student_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fa-solid fa-trash me-1"></i> Confirm Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>

{% extends 'base.html' %}

{% block title %}{{ module_name }} | Grace Academy SMS{% endblock %}

{% block content %}
<div class="container-fluid py-5 text-center">
    <div class="card border-0 shadow-sm p-5 rounded-4 mx-auto bg-white" style="max-width: 500px;">
        <div class="mb-3 text-primary">
            <i class="fa-solid fa-screwdriver-wrench display-4"></i>
        </div>
        <h5 class="fw-bold text-dark mb-2">{{ module_name }}</h5>
        <p class="text-muted small mb-4">This feature is currently under development for Grace Academy SMS.</p>
        <div>
            <a href="{% url 'dashboard' %}" class="btn btn-primary rounded-3 px-4">Return to Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}

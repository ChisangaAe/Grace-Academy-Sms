{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h4 class="fw-bold text-dark mb-3">Set New Password</h4>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label small fw-bold">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <div class="text-danger small">{{ field.errors.0 }}</div>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn btn-primary w-100 fw-bold">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

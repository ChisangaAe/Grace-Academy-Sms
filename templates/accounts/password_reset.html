{% extends 'base.html' %}

{% block title %}Reset Password - Grace Academy{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <h4 class="fw-bold text-dark mb-2">Forgot Password?</h4>
            <p class="text-muted small mb-4">Enter your registered email address and we'll generate a password reset link.</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label small fw-bold">Email Address</label>
                    <input type="email" name="email" class="form-control" placeholder="name@domain.com" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 fw-bold">Send Reset Link</button>
            </form>
            <div class="mt-3 text-center">
                <a href="{% url 'login' %}" class="small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

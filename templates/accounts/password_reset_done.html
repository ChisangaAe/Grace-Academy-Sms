{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 text-center">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <i class="fa-solid fa-paper-plane fa-3x text-success mb-3"></i>
            <h4 class="fw-bold text-dark">Check Your Terminal / Console</h4>
            <p class="text-muted small">We've generated a password reset link. Since you are in development mode, check your **VS Code / PowerShell terminal** to copy the reset URL!</p>
            <a href="{% url 'login' %}" class="btn btn-outline-primary btn-sm mt-2">Return to Login</a>
        </div>
    </div>
</div>
{% endblock %}

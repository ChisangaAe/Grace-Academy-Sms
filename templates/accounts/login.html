{% extends 'base.html' %}

{% block title %}Login - Grace Academy{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-4">
        <div class="card border-0 shadow-sm p-4 bg-white">
            <div class="text-center mb-4">
                <i class="fa-solid fa-graduation-cap fa-3x text-primary mb-2"></i>
                <h4 class="fw-bold text-dark">Grace Academy</h4>
                <p class="text-muted small">Sign in to access your dashboard</p>
            </div>

            <form method="post">
                {% csrf_token %}
                {% if form.errors %}
                    <div class="alert alert-danger py-2 small">Invalid username or password.</div>
                {% endif %}

                <div class="mb-3">
                    <label class="form-label small fw-bold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-bold">Password</label>
                        <a href="{% url 'password_reset' %}" class="small text-decoration-none">Forgot password?</a>
                    </div>
                    <input type="password" name="password" class="form-control" placeholder="Enter password" required>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                    <i class="fa-solid fa-right-to-bracket me-1"></i> Log In
                </button>
            </form>

            <div class="text-center border-top pt-3">
                <p class="small text-muted mb-0">Don't have an account? <a href="{% url 'signup' %}" class="fw-bold text-decoration-none">Sign Up</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
